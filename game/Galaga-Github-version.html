<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaga Final Max</title>
  <style>
    :root {
      --bg: #020712;
      --panel: rgba(9, 16, 29, 0.7);
      --cyan: #7ae7ff;
      --white: #edf6ff;
      --yellow: #ffe77a;
      --red: #ff5e5e;
      --purple: #b775ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #0f1e33 0%, #050b16 35%, #020712 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
    }

    .game-shell {
      width: min(96vw, 930px);
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    canvas {
      width: min(96vw, 900px);
      height: auto;
      display: block;
      background: #01050d;
      border: 2px solid rgba(122, 231, 255, 0.35);
      box-shadow: 0 0 30px rgba(32, 108, 255, 0.25);
    }

    .hud {
      width: min(96vw, 900px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(122, 231, 255, 0.3);
      background: var(--panel);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(122, 231, 255, 0.6);
      background: rgba(12, 28, 39, 0.8);
      color: var(--white);
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--cyan);
      background: rgba(22, 48, 66, 0.9);
    }

    .difficulty-select {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .difficulty-select button.active {
      background: rgba(122, 231, 255, 0.16);
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(122, 231, 255, 0.35);
    }

    .status {
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--yellow);
    }
  </style>
</head>

<body>
  <div class="game-shell">
    <div class="hud">
      <div class="controls">
        <button id="pause-button">Pause</button>
        <button id="start-button">Start Game</button>
        <button id="restart-button">Restart</button>
      </div>

      <div class="difficulty-select" aria-label="Difficulty selection">
        <button class="diff-btn active" data-difficulty="EASY">Easy</button>
        <button class="diff-btn" data-difficulty="NORMAL">Normal</button>
        <button class="diff-btn" data-difficulty="HARD">Hard</button>
        <button class="diff-btn" data-difficulty="INSANE">Insane</button>
      </div>

      <div id="status" class="status">READY</div>
    </div>

    <canvas id="gameCanvas" width="900" height="700"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const startButton = document.getElementById('start-button');
    const pauseButton = document.getElementById('pause-button');
    const restartButton = document.getElementById('restart-button');
    const diffButtons = [...document.querySelectorAll('.diff-btn')];

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const FPS = 60;

    const WHITE = [255, 255, 255];
    const RED = [255, 80, 80];
    const GREEN = [80, 255, 80];
    const YELLOW = [255, 255, 80];
    const CYAN = [80, 255, 255];
    const PURPLE = [180, 80, 255];
    const ORANGE = [255, 140, 0];
    const BLUE = [80, 160, 255];

    const settings = {
      EASY: { enemy_speed: 3, boss_hp: 10, fire_rate: 0.5 },
      NORMAL: { enemy_speed: 5, boss_hp: 16, fire_rate: 1 },
      HARD: { enemy_speed: 8, boss_hp: 30, fire_rate: 1.4 },
      INSANE: { enemy_speed: 12, boss_hp: 80, fire_rate: 2.2 }
    };

    let announcement = '';
    let announcementTimer = 0;
    const HIGH_SCORE_KEY = 'galaga-ultimate-final-max-highscore';
    const keys = {};
    const stars = [];
    const particles = [];

    let isPaused = false;
    let currentDifficulty = 'NORMAL';
    let gameState = 'title';
    let wave = 1;
    let player = null;
    let enemies = [];
    let lastTime = 0;

    function initStars() {
      stars.length = 0;
      for (let i = 0; i < 170; i += 1) {
        stars.push({
          x: Math.random() * WIDTH,
          y: Math.random() * HEIGHT,
          speed: 1 + Math.random() * 3
        });
      }
    }

    function loadHighScore() {
      const value = Number(localStorage.getItem(HIGH_SCORE_KEY) || 0);
      return Number.isFinite(value) ? value : 0;
    }

    function saveHighScore(score) {
      const previous = loadHighScore();
      if (score > previous) {
        localStorage.setItem(HIGH_SCORE_KEY, String(score));
      }
    }

    function drawStars() {
      for (const star of stars) {
        star.y += star.speed;
        if (star.y > HEIGHT) {
          star.x = Math.random() * WIDTH;
          star.y = 0;
        }

        ctx.fillStyle = 'rgba(200, 200, 255, 0.9)';
        ctx.fillRect(star.x, star.y, 2, 2);
      }
    }

    function spawnExplosion(x, y, count = 25) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 2.5;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 15 + Math.random() * 10
        });
      }
    }

    function togglePause() {
      if (gameState !== 'playing') return;
      isPaused = !isPaused;

      if (isPaused) {
        statusEl.textContent = 'PAUSED';
      } else {
        statusEl.textContent = `Wave ${wave} • ${currentDifficulty}`;
      }
    }

    function showAnnouncement(text, duration = 90) {
  announcement = text;
  announcementTimer = duration;
  }
    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const radius = Math.max(1, p.life / 12);
        ctx.fillStyle = `rgba(255, 150, 0, ${Math.min(1, p.life / 25)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function setDifficulty(name) {
      currentDifficulty = name;
      diffButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.difficulty === name);
      });
      statusEl.textContent = `Difficulty: ${name}`;
    }

    function showTitleScreen() {
      statusEl.textContent = `Difficulty: ${currentDifficulty}`;
    }

    class Player {
      constructor() {
        this.x = WIDTH / 2;
        this.y = HEIGHT - 60;
        this.speed = 6;
        this.bullets = [];
        this.cooldown = 0;
        this.lives = 3;
        this.score = 0;
        this.invincible = 0;
        this.dead = false;
        this.respawnTimer = 0;
        this.radius = 12;
        this.deathTimer = 0;
      }

      move() {
        if (this.dead) return;
        if (keys.ArrowLeft || keys.a) this.x -= this.speed;
        if (keys.ArrowRight || keys.d) this.x += this.speed;
        if (this.x < 20) this.x = 20;
        if (this.x > WIDTH - 20) this.x = WIDTH - 20;
      }

      shoot() {
        if (this.cooldown === 0 && !this.dead) {
          this.bullets.push([this.x, this.y]);
          this.cooldown = 8;
        }
      }

      die() {
        this.dead = true;
        this.respawnTimer = 90;
        this.deathTimer = 60;
        spawnExplosion(this.x, this.y, 60);
      }

      update() {
        if (this.dead) {
          this.respawnTimer -= 1;
          this.deathTimer -= 1;
          if (this.respawnTimer <= 0) {
            if (this.lives <= 0) {
              saveHighScore(this.score);
              gameState = 'gameover';
              return;
            }

            this.dead = false;
            this.invincible = 120;
            this.x = WIDTH / 2;
          }
          return;
        }

        if (this.cooldown > 0) this.cooldown -= 1;
        if (this.invincible > 0) this.invincible -= 1;

        for (const bullet of this.bullets) {
          bullet[1] -= 10;
        }
        this.bullets = this.bullets.filter((bullet) => bullet[1] > 0);
      }

      draw() {
        if (this.dead) {
          if (this.deathTimer > 0) {
            const radius = (60 - this.deathTimer) * 2;
            ctx.strokeStyle = 'rgba(255, 80, 0, 1)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
            ctx.stroke();
          }
          return;
        }

        if (this.invincible > 0 && this.invincible % 6 < 3) {
          return;
        }

        ctx.fillStyle = 'rgb(0, 180, 255)';
        ctx.beginPath();
        ctx.arc(this.x, this.y + 10, 20, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 180, 255, 1)';
        ctx.stroke();

        ctx.fillStyle = 'rgb(80, 255, 255)';
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - 14, this.y + 24);
        ctx.lineTo(this.x + 14, this.y + 24);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgb(80, 160, 255)';
        ctx.beginPath();
        ctx.arc(this.x, this.y + 10, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgb(255, 140, 0)';
        ctx.beginPath();
        ctx.arc(this.x, this.y + 28, 4, 0, Math.PI * 2);
        ctx.fill();

        for (const bullet of this.bullets) {
          ctx.fillStyle = 'rgb(255, 255, 80)';
          ctx.fillRect(bullet[0] - 2, bullet[1], 4, 12);
        }
      }
    }

    class Enemy {
      constructor(x, y, wave, boss = false, mini = false) {
        this.x = x;
        this.y = -100;
        this.ty = y;
        this.wave = wave;
        this.boss = boss;
        this.mini = mini;

        const baseHp = settings[currentDifficulty].boss_hp;

        if (mini) {
          this.maxHp = Math.floor(baseHp / 2 + wave * 2);
        } else if (boss) {
          this.maxHp = Math.floor(baseHp * 0.75 + wave * 3);
        } else {
          this.maxHp = 1 + Math.floor(wave / 3);
        }

        this.hp = this.maxHp;
        this.radius = boss ? 34 : mini ? 24 : 14;
        this.bullets = [];
        this.t = 0;
        this.deadAnim = 0;
        this.diving = false;
        this.scored = false;
        this.hitFlash = 0;
        this.bossDrift = Math.random() * Math.PI * 2;
      }

      startDive(player) {
        this.diving = true;
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const d = Math.hypot(dx, dy) + 0.001;
        const speed = settings[currentDifficulty].enemy_speed + 2;
        this.dvx = (dx / d) * speed;
        this.dvy = (dy / d) * speed;
      }

      update(player) {
        if (this.deadAnim > 0) {
          this.deadAnim -= 1;
          return;
        }

        this.t += 1;
        if (this.hitFlash > 0) this.hitFlash -= 1;

        if (this.boss) {
          this.x += Math.sin(this.t * 0.12 + this.bossDrift) * 1.7;
          if (this.x < 80) this.x = 80;
          if (this.x > WIDTH - 80) this.x = WIDTH - 80;
        } else {
          this.x += Math.sin(this.t * 0.05) * 2;
        }

        if (!this.diving && Math.random() < 0.002) {
          this.startDive(player);
        }

        if (this.diving) {
          this.x += this.dvx;
          this.y += this.dvy;
          if (this.y > HEIGHT) {
            this.diving = false;
            this.y = -100;
          }
        } else if (this.y < this.ty) {
          this.y += 2;
        }

        if (this.mini) {
          if (this.t % 50 === 0) {
            for (let i = 0; i < 6; i += 1) {
              const angle = i * ((Math.PI * 2) / 6);
              this.bullets.push([
                this.x,
                this.y,
                Math.cos(angle) * 3,
                Math.sin(angle) * 3
              ]);
            }
          }

          if (this.t % 75 === 0) {
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const d = Math.hypot(dx, dy) + 0.001;
            this.bullets.push([this.x, this.y, (dx / d) * 4, (dy / d) * 4]);
          }
        }

        if (this.boss) {
          let phase = 1;
          if (this.hp < this.maxHp * 0.65) phase = 2;
          if (this.hp < this.maxHp * 0.35) phase = 3;
          if (currentDifficulty === 'INSANE' && this.hp < this.maxHp * 0.15) phase = 4;

          let speedMult = 1.0;
          if (currentDifficulty === 'INSANE') speedMult = 1.1;

          if (phase === 1 && this.t % 60 === 0) {
            for (let i = 0; i < 8; i += 1) {
              const angle = i * ((Math.PI * 2) / 8) + this.t * 0.05;
              this.bullets.push([
                this.x,
                this.y,
                Math.cos(angle) * (3.1 * speedMult),
                Math.sin(angle) * (3.1 * speedMult)
              ]);
            }
          } else if (phase === 2 && this.t % 18 === 0) {
            const angle = this.t * 0.12;
            for (let i = 0; i < 3; i += 1) {
              const a = angle + i * ((Math.PI * 2) / 3);
              this.bullets.push([
                this.x,
                this.y,
                Math.cos(a) * (4.5 * speedMult),
                Math.sin(a) * (4.5 * speedMult)
              ]);
            }
          } else if (phase === 3 && this.t % 24 === 0) {
            for (let i = 0; i < 12; i += 1) {
              const angle = i * ((Math.PI * 2) / 12) + this.t * 0.08;
              this.bullets.push([
                this.x,
                this.y,
                Math.cos(angle) * (4.8 * speedMult),
                Math.sin(angle) * (4.8 * speedMult)
              ]);
            }
            const dx = player.x - this.x;
            const dy = player.y - this.y;
            const d = Math.hypot(dx, dy) + 0.001;
            this.bullets.push([this.x, this.y, (dx / d) * (5.4 * speedMult), (dy / d) * (5.4 * speedMult)]);
          } else if (phase === 4 && this.t % 10 === 0) {
            const angle = this.t * 0.22;
            for (let i = 0; i < 5; i += 1) {
              const a = angle + i * ((Math.PI * 2) / 5);
              this.bullets.push([
                this.x,
                this.y,
                Math.cos(a) * 5.8,
                Math.sin(a) * 5.8
              ]);
            }

            if (this.t % 20 === 0) {
              const dx = player.x - this.x;
              const dy = player.y - this.y;
              const d = Math.hypot(dx, dy) + 0.001;
              this.bullets.push([this.x, this.y, (dx / d) * 7.2, (dy / d) * 7.2]);
            }
          }
        }

        for (const bullet of this.bullets) {
          bullet[0] += bullet[2];
          bullet[1] += bullet[3];
        }
      }

      draw() {
        if (this.deadAnim > 0) {
          spawnExplosion(this.x, this.y, 10);
          return;
        }

        const shake = this.hitFlash > 0 ? Math.floor(Math.random() * 5) - 2 : 0;

        if (this.mini) {
          const pulse = Math.round(Math.sin(this.t * 0.2) * 3);
          ctx.fillStyle = 'rgba(60, 30, 0, 1)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + 6 + pulse, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 140, 0, 1)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgb(255, 255, 80)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
          ctx.fill();

          const barW = 80;
          const ratio = this.hp / this.maxHp;
          ctx.fillStyle = 'rgb(255, 80, 80)';
          ctx.fillRect(this.x - barW / 2, this.y - 40, barW, 6);
          ctx.fillStyle = 'rgb(80, 255, 80)';
          ctx.fillRect(this.x - barW / 2, this.y - 40, barW * ratio, 6);
        } else if (this.boss) {
          const pulse = Math.round(Math.sin(this.t * 0.25) * 8);
          const phaseGlow = currentDifficulty === 'INSANE' && this.hp < this.maxHp * 0.15;

          ctx.fillStyle = phaseGlow ? 'rgba(255, 20, 20, 0.9)' : 'rgba(30, 0, 70, 0.95)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + 18 + pulse, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = phaseGlow ? 'rgba(255, 255, 90, 0.95)' : 'rgba(180, 80, 255, 0.95)';
          ctx.beginPath();
          ctx.arc(this.x + shake, this.y, this.radius + 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = phaseGlow ? 'rgba(255, 55, 140, 0.95)' : 'rgba(80, 160, 255, 0.95)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius - 10, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = phaseGlow ? 'rgba(255, 255, 255, 0.95)' : 'rgba(255, 200, 80, 0.8)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + 26, 0, Math.PI * 2);
          ctx.stroke();

          for (let i = 0; i < 8; i += 1) {
            const orbit = this.t * 0.12 + i * (Math.PI / 4);
            const px = this.x + Math.cos(orbit) * (this.radius + 22);
            const py = this.y + Math.sin(orbit) * (this.radius + 22);
            ctx.fillStyle = phaseGlow ? 'rgba(255,255,255,1)' : 'rgba(255, 180, 0, 1)';
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = phaseGlow ? 'rgba(255, 255, 255, 1)' : 'rgba(255, 100, 100, 1)';
          ctx.beginPath();
          ctx.arc(this.x, this.y, 7, 0, Math.PI * 2);
          ctx.fill();

          const barW = phaseGlow ? 140 : 120;
          const ratio = this.hp / this.maxHp;
          ctx.fillStyle = 'rgb(255, 80, 80)';
          ctx.fillRect(this.x - barW / 2, this.y - 60, barW, phaseGlow ? 10 : 8);
          ctx.fillStyle = 'rgb(80, 255, 80)';
          ctx.fillRect(this.x - barW / 2, this.y - 60, barW * ratio, phaseGlow ? 10 : 8);
        } else {
          ctx.fillStyle = 'rgb(120, 0, 0)';
          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(this.x - 16, this.y + 20);
          ctx.lineTo(this.x + 16, this.y + 20);
          ctx.closePath();
          ctx.fill();
        }

        for (const bullet of this.bullets) {
          ctx.fillStyle = 'rgb(80, 255, 80)';
          ctx.beginPath();
          ctx.arc(bullet[0], bullet[1], 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function createWave(w) {
      if (w % 4 === 0) {
        return [new Enemy(WIDTH / 2, 120, w, false, true)];
      }
      if (w % 5 === 0) {
        return [new Enemy(WIDTH / 2, 120, w, true, false)];
      }

      const created = [];
      for (let row = 0; row < 5; row += 1) {
        for (let column = 0; column < 8; column += 1) {
          created.push(new Enemy(120 + column * 80, 80 + row * 50, w));
        }
      }
      return created;
    }

    function startGame() {
      player = new Player();
      wave = 1;
      enemies = createWave(wave);
      gameState = 'playing';
      statusEl.textContent = `Wave ${wave} • ${currentDifficulty}`;
    }

    function restartGame() {
      startGame();
    }

    function handlePlayerShoot() {
      if (player) player.shoot();
    }

    function updateGame() {
      if (gameState !== 'playing' || !player || isPaused) return;

      player.move();
      const result = player.update();
      if (result === 'GAME_OVER') {
        saveHighScore(player.score);
        gameState = 'gameover';
        return;
      }

      for (const enemy of enemies) {
        enemy.update(player);
      }

      for (let i = player.bullets.length - 1; i >= 0; i -= 1) {
        const bullet = player.bullets[i];
        let bulletHit = false;

        for (const enemy of enemies) {
          if (Math.hypot(bullet[0] - enemy.x, bullet[1] - enemy.y) < enemy.radius) {
            enemy.hp -= 1;
            enemy.hitFlash = 5;
            player.bullets.splice(i, 1);
            bulletHit = true;

            if (enemy.hp <= 0 && !enemy.scored) {
              enemy.deadAnim = 20;
              player.score += enemy.boss ? 220 : enemy.mini ? 110 : 35;
              enemy.scored = true;
            }
            break;
          }
        }

        if (bulletHit) continue;
      }

      for (const enemy of enemies) {
        if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < player.radius + enemy.radius) {
          if (player.invincible === 0 && !player.dead) {
            player.lives -= 1;
            player.die();
          }
        }

        for (const bullet of enemy.bullets) {
          if (Math.hypot(player.x - bullet[0], player.y - bullet[1]) < player.radius) {
            if (player.invincible === 0 && !player.dead) {
              player.lives -= 1;
              player.die();
            }
          }
        }
      }

      enemies = enemies.filter((enemy) => !(enemy.hp <= 0 && enemy.deadAnim === 0));

      if (enemies.length === 0) {
        wave += 1;
        enemies = createWave(wave);
        statusEl.textContent = `Wave ${wave} • ${currentDifficulty}`;
      }

      updateParticles();
    }

    if (announcementTimer > 0) {
  announcementTimer -= 1;

  ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
  ctx.fillRect(200, 120, 500, 90);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 38px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(announcement, WIDTH / 2, 180);

  ctx.textAlign = 'left';

  if (announcementTimer === 0) {
    announcement = '';
  }
}
    function drawHud() {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '22px Arial';
      ctx.fillText(`Score: ${player ? player.score : 0}`, 10, 24);
      ctx.fillText(`Lives: ${player ? player.lives : 0}`, 10, 58);
      ctx.fillText(`Wave: ${wave}`, 10, 92);
      ctx.fillText(`High Score: ${loadHighScore()}`, 10, 126);
    }

    function drawTitleScreen() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      drawStars();

      ctx.fillStyle = 'white';
      ctx.font = 'bold 42px Arial';
      ctx.fillText('GALAGA FINAL MAX', 250, 250);
      ctx.font = '22px Arial';
      ctx.fillText('1 EASY   2 NORMAL   3 HARD   4 INSANE', 220, 300);
      ctx.fillText(`Current: ${currentDifficulty}`, 330, 340);
      ctx.fillText('Press Space to Start', 310, 380);
    }

    function drawGameOver() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      drawStars();

      ctx.fillStyle = 'white';
      ctx.font = 'bold 44px Arial';
      ctx.fillText('GAME OVER', 330, 310);
      ctx.font = '24px Arial';
      ctx.fillText(`Score: ${player ? player.score : 0}`, 370, 360);
      ctx.fillText('Press R or click Restart to play again', 200, 420);
    }

function draw() {
  ctx.clearRect(0, 0, WIDTH, HEIGHT);

  if (gameState === 'title') {
    drawTitleScreen();
    return;
  }

  if (gameState === 'gameover') {
    drawGameOver();
    return;
  }

  drawStars();

  if (announcementTimer > 0) {
    announcementTimer -= 1;

    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fillRect(200, 120, 500, 90);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 38px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(announcement, WIDTH / 2, 180);

    ctx.textAlign = 'left';

    if (announcementTimer === 0) {
      announcement = '';
    }
  }

  if (player) {
    player.draw();
  }
  for (const enemy of enemies) {
    enemy.draw();
  }
  drawParticles();
  drawHud();
}
if (enemies.length === 0) {
  wave += 1;
  showAnnouncement(`WAVE ${wave}`, 90);
  enemies = createWave(wave);
  statusEl.textContent = `Wave ${wave} • ${currentDifficulty}`;
}
if (w % 5 === 0) {
  showAnnouncement('BOSS WAVE', 120);
  return [new Enemy(WIDTH / 2, 120, w, true, false)];
}
    function updateFrame() {
      updateGame();
      draw();
      requestAnimationFrame(updateFrame);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key;
      keys[key] = true;
      keys[event.keyCode] = true;

      if (key === ' ') {
        event.preventDefault();
        if (gameState === 'title') {
          startGame();
        } else if (gameState === 'playing') {
          handlePlayerShoot();
        }
      }

      if (key === 'p' || key === 'P') {
        togglePause();
      }

      if (key === 'k' || key === 'K' || key === 'f' || key === 'F') {
        if (gameState === 'playing') {
          wave += 1;
          enemies = createWave(wave);
          statusEl.textContent = `Wave ${wave} • ${currentDifficulty}`;
        }
      }

      if (key === '1') setDifficulty('EASY');
      if (key === '2') setDifficulty('NORMAL');
      if (key === '3') setDifficulty('HARD');
      if (key === '4') setDifficulty('INSANE');

      if (key === 'r' || key === 'R') {
        if (gameState === 'gameover') {
          restartGame();
        }
      }
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key;
      keys[key] = false;
      keys[event.keyCode] = false;
    });

    diffButtons.forEach((button) => {
      button.addEventListener('click', () => {
        setDifficulty(button.dataset.difficulty);
      });
    });

    pauseButton.addEventListener('click', () => {
      togglePause();
    });

    startButton.addEventListener('click', () => {
      startGame();
    });

    restartButton.addEventListener('click', () => {
      restartGame();
    });

    initStars();
    setDifficulty(currentDifficulty);
    showTitleScreen();
    requestAnimationFrame(updateFrame);
  </script>
</body>

</html>
