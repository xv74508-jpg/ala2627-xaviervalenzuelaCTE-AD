<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>Rock Paper Scissors</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102a43;
      --muted: #627d98;
      --paper: #f5f7f4;
      --card: #ffffff;
      --line: #d9e2ec;
      --blue: #1d6fa5;
      --blue-dark: #15547d;
      --coral: #e76f51;
      --yellow: #f4c95d;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      background-image: linear-gradient(135deg, rgba(244, 201, 93, .16), transparent 42%),
        radial-gradient(circle at 92% 8%, rgba(29, 111, 165, .15), transparent 26rem);
    }

    .page {
      width: min(100% - 2rem, 920px);
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .eyebrow {
      margin: 0 0 .6rem;
      color: var(--coral);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 570px;
      margin-bottom: .75rem;
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 7vw, 5.2rem);
      line-height: .94;
      letter-spacing: -.055em;
    }

    .intro {
      max-width: 440px;
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .scoreboard {
      display: flex;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 12px 30px rgba(16, 42, 67, .08);
    }

    .score {
      min-width: 78px;
      padding: .8rem .9rem;
      text-align: center;
    }

    .score+.score {
      border-left: 1px solid var(--line);
    }

    .score strong {
      display: block;
      font-size: 1.8rem;
      line-height: 1;
    }

    .score span {
      color: var(--muted);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .game-card {
      position: relative;
      overflow: hidden;
      padding: clamp(1.25rem, 4vw, 2.6rem);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 20px 45px rgba(16, 42, 67, .1);
    }

    .game-card::before {
      position: absolute;
      top: 0;
      right: 0;
      width: 34%;
      height: 5px;
      background: var(--coral);
      content: "";
    }

    .arena {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      min-height: 190px;
      border-bottom: 1px solid var(--line);
    }

    .fighter {
      text-align: center;
    }

    .fighter-label {
      margin-bottom: .8rem;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .choice-display {
      font-size: clamp(4rem, 12vw, 7rem);
      line-height: 1;
    }

    .versus {
      color: var(--coral);
      font-family: Georgia, serif;
      font-size: 1.4rem;
      font-style: italic;
    }

    .message {
      min-height: 58px;
      margin: 0;
      padding: 1.25rem 0;
      color: var(--blue-dark);
      font-family: Georgia, serif;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      text-align: center;
    }

    .prompt {
      margin: 0 0 1rem;
      color: var(--muted);
      text-align: center;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .8rem;
    }

    .choice-button {
      min-height: 132px;
      padding: 1rem;
      cursor: pointer;
      border: 2px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--card);
      font: inherit;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .choice-button:hover,
    .choice-button:focus-visible {
      border-color: var(--blue);
      box-shadow: 0 8px 18px rgba(29, 111, 165, .15);
      outline: none;
      transform: translateY(-3px);
    }

    .choice-button:active {
      transform: translateY(0);
    }

    .choice-icon {
      display: block;
      margin-bottom: .45rem;
      font-size: 2.6rem;
    }

    .choice-name {
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .rounds {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .reset-button {
      padding: .65rem 1rem;
      cursor: pointer;
      border: 1px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: .85rem;
      font-weight: 700;
    }

    .reset-button:hover,
    .reset-button:focus-visible {
      color: white;
      background: var(--ink);
      outline: none;
    }

    @media (max-width: 620px) {
      .page {
        padding-top: 1.25rem;
      }

      header {
        display: block;
      }

      .scoreboard {
        margin-top: 1.25rem;
      }

      .score {
        flex: 1;
      }

      .arena {
        min-height: 150px;
      }

      .choice-button {
        min-height: 112px;
        padding: .6rem;
      }

      .choice-icon {
        font-size: 2rem;
      }

      .footer-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .choice-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">Quick match / best score</p>
        <h1>Rock, paper,<br>scissors.</h1>
        <p class="intro">Pick your move. The computer is ready, but it has no idea what you are about to throw.</p>
      </div>
      <div class="scoreboard" aria-label="Game score">
        <div class="score"><strong id="player-score">0</strong><span>You</span></div>
        <div class="score"><strong id="computer-score">0</strong><span>CPU</span></div>
      </div>
    </header>

    <section class="game-card" aria-labelledby="game-status">
      <div class="arena" aria-live="polite">
        <div class="fighter">
          <div class="fighter-label">Your move</div>
          <div class="choice-display" id="player-choice" aria-hidden="true">❔</div>
        </div>
        <div class="versus">vs.</div>
        <div class="fighter">
          <div class="fighter-label">Computer</div>
          <div class="choice-display" id="computer-choice" aria-hidden="true">❔</div>
        </div>
      </div>
      <p class="message" id="game-status">Choose your move to start the round.</p>
      <p class="prompt">What will you throw?</p>
      <div class="choices" role="group" aria-label="Choose rock, paper, or scissors">
        <button class="choice-button" type="button" data-choice="rock"><span class="choice-icon"
            aria-hidden="true">✊</span><span class="choice-name">Rock</span></button>
        <button class="choice-button" type="button" data-choice="paper"><span class="choice-icon"
            aria-hidden="true">✋</span><span class="choice-name">Paper</span></button>
        <button class="choice-button" type="button" data-choice="scissors"><span class="choice-icon"
            aria-hidden="true">✌️</span><span class="choice-name">Scissors</span></button>
      </div>
      <div class="footer-row">
        <p class="rounds">Rounds played: <strong id="round-count">0</strong></p>
        <button class="reset-button" id="reset-button" type="button">Reset score</button>
      </div>
    </section>
  </main>

  <script>
    const moves = {
      rock: { icon: "✊", label: "Rock" },
      paper: { icon: "✋", label: "Paper" },
      scissors: { icon: "✌️", label: "Scissors" }
    };
    const choices = Object.keys(moves);
    let playerScore = 0;
    let computerScore = 0;
    let roundCount = 0;

    const playerChoice = document.querySelector("#player-choice");
    const computerChoice = document.querySelector("#computer-choice");
    const status = document.querySelector("#game-status");
    const playerScoreElement = document.querySelector("#player-score");
    const computerScoreElement = document.querySelector("#computer-score");
    const roundCountElement = document.querySelector("#round-count");

    function getResult(playerMove, computerMove) {
      if (playerMove === computerMove) return "tie";
      if ((playerMove === "rock" && computerMove === "scissors") ||
        (playerMove === "paper" && computerMove === "rock") ||
        (playerMove === "scissors" && computerMove === "paper")) return "win";
      return "loss";
    }

    function playRound(playerMove) {
      const computerMove = choices[Math.floor(Math.random() * choices.length)];
      const result = getResult(playerMove, computerMove);
      roundCount += 1;
      if (result === "win") playerScore += 1;
      if (result === "loss") computerScore += 1;
      playerChoice.textContent = moves[playerMove].icon;
      computerChoice.textContent = moves[computerMove].icon;
      playerScoreElement.textContent = playerScore;
      computerScoreElement.textContent = computerScore;
      roundCountElement.textContent = roundCount;
      status.textContent = result === "tie"
        ? `A tie. You both chose ${moves[playerMove].label.toLowerCase()}.`
        : result === "win"
          ? `${moves[playerMove].label} beats ${moves[computerMove].label.toLowerCase()}. You win!`
          : `${moves[computerMove].label} beats ${moves[playerMove].label.toLowerCase()}. Computer wins.`;
    }

    document.querySelectorAll("[data-choice]").forEach((button) => {
      button.addEventListener("click", () => playRound(button.dataset.choice));
    });

    document.querySelector("#reset-button").addEventListener("click", () => {
      playerScore = 0;
      computerScore = 0;
      roundCount = 0;
      playerChoice.textContent = "❔";
      computerChoice.textContent = "❔";
      playerScoreElement.textContent = "0";
      computerScoreElement.textContent = "0";
      roundCountElement.textContent = "0";
      status.textContent = "Choose your move to start the round.";
    });
  </script>
</body>

</html>
