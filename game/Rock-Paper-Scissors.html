<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <title>Rock Paper Scissors</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3f7fb;
      --muted: #9fb3c8;
      --paper: #08111f;
      --card: #111f32;
      --line: #29415b;
      --blue: #43b5e6;
      --blue-dark: #9ddcf2;
      --coral: #ff856d;
      --yellow: #f4c95d;
      --player-accent: #55d6ff;
      --computer-accent: #ff8f78;
      --score-surface: linear-gradient(135deg, #172d49, #0c1b2f);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    body[data-theme="vibrant"] {
      color-scheme: light;
      --ink: #17213b;
      --muted: #52617d;
      --paper: #fff4dc;
      --card: #fffdf7;
      --line: #e8b86b;
      --blue: #1479a8;
      --blue-dark: #176486;
      --coral: #e4573d;
      --yellow: #c57c05;
      --player-accent: #087ea4;
      --computer-accent: #d64232;
      --score-surface: linear-gradient(135deg, #fffdf3, #ffe6a8);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      background-image: linear-gradient(135deg, rgba(255, 133, 109, .09), transparent 42%),
        radial-gradient(circle at 92% 8%, rgba(67, 181, 230, .14), transparent 26rem),
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: auto, auto, 34px 34px, 34px 34px;
      transition: color .25s ease, background-color .25s ease;
    }

    body[data-theme="vibrant"] {
      background-image: linear-gradient(135deg, rgba(228, 87, 61, .16), transparent 42%),
        radial-gradient(circle at 92% 8%, rgba(20, 121, 168, .18), transparent 26rem),
        linear-gradient(rgba(23, 33, 59, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23, 33, 59, .05) 1px, transparent 1px);
    }

    .page {
      width: min(100% - 2rem, 920px);
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .header-tools {
      display: flex;
      justify-content: flex-end;
    }

    .eyebrow {
      margin: 0 0 .6rem;
      color: var(--coral);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 570px;
      margin-bottom: .75rem;
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 7vw, 5.2rem);
      line-height: .94;
      letter-spacing: -.055em;
    }

    .intro {
      max-width: 440px;
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .scoreboard {
      display: flex;
      width: min(100%, 440px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--score-surface);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 255, 255, .12);
    }

    .score {
      min-width: 100px;
      padding: .8rem 1rem .9rem;
      text-align: center;
    }

    .score+.score {
      border-left: 1px solid var(--line);
    }

    .score strong {
      display: block;
      color: var(--ink);
      font-size: 2.2rem;
      line-height: 1;
    }

    .score span {
      color: var(--muted);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .score:first-child strong {
      color: var(--player-accent);
    }

    .score:last-child strong {
      color: var(--computer-accent);
    }

    .score-icon {
      display: block;
      margin-bottom: .35rem;
      font-size: 1rem;
    }

    .theme-toggle {
      padding: .5rem .75rem;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(17, 31, 50, .7);
      font: inherit;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .04em;
    }

    body[data-theme="vibrant"] .theme-toggle {
      background: rgba(255, 255, 255, .7);
    }

    .theme-toggle:hover,
    .theme-toggle:focus-visible {
      border-color: var(--coral);
      outline: 3px solid rgba(228, 87, 61, .2);
      outline-offset: 2px;
    }

    .game-card {
      position: relative;
      overflow: hidden;
      padding: clamp(1.25rem, 4vw, 2.6rem);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 20px 45px rgba(0, 0, 0, .3);
    }

    .scoreboard-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }

    .scoreboard-heading {
      margin: 0;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .game-card::before {
      position: absolute;
      top: 0;
      right: 0;
      width: 34%;
      height: 5px;
      background: var(--coral);
      content: "";
    }

    .arena {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      min-height: 210px;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(67, 181, 230, .08), rgba(255, 133, 109, .05));
    }

    .fighter {
      text-align: center;
    }

    .fighter-label {
      margin-bottom: .8rem;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .choice-display {
      font-size: clamp(4rem, 12vw, 7rem);
      line-height: 1;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .25));
    }

    .versus {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(255, 133, 109, .5);
      border-radius: 50%;
      color: var(--coral);
      font-family: Georgia, serif;
      font-size: 1.4rem;
      font-style: italic;
    }

    .message {
      min-height: 58px;
      margin: 0;
      padding: 1.25rem 0;
      color: var(--blue-dark);
      font-family: Georgia, serif;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      text-align: center;
    }

    .countdown {
      min-height: 2.6rem;
      margin: .9rem 0 -.2rem;
      color: var(--yellow);
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      text-shadow: 0 0 18px rgba(244, 201, 93, .35);
    }

    .countdown[hidden] {
      display: block;
      visibility: hidden;
    }

    .prompt {
      margin: 0 0 1rem;
      color: var(--muted);
      text-align: center;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .8rem;
    }

    .choice-button {
      min-height: 132px;
      padding: 1rem;
      cursor: pointer;
      border: 2px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #172940;
      font: inherit;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .choice-button:hover,
    .choice-button:focus-visible {
      border-color: var(--blue);
      box-shadow: 0 8px 18px rgba(29, 111, 165, .15);
      outline: none;
      transform: translateY(-3px);
    }

    .choice-button:disabled {
      cursor: wait;
      opacity: .55;
      transform: none;
    }

    .choice-button:active {
      transform: translateY(0);
    }

    .choice-icon {
      display: block;
      margin-bottom: .45rem;
      font-size: 2.6rem;
    }

    .choice-name {
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .rounds {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .reset-button {
      padding: .65rem 1rem;
      cursor: pointer;
      border: 1px solid var(--ink);
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      font: inherit;
      font-size: .85rem;
      font-weight: 700;
    }

    .reset-button:hover,
    .reset-button:focus-visible {
      color: white;
      background: var(--ink);
      outline: none;
    }

    .reset-button:disabled {
      cursor: wait;
      opacity: .55;
    }

    @media (max-width: 620px) {
      .page {
        padding-top: 1.25rem;
      }

      header {
        display: block;
      }

      .header-tools {
        justify-items: start;
        margin-top: 1.25rem;
      }

      .scoreboard {
        width: 100%;
      }

      .scoreboard-panel {
        align-items: flex-start;
        flex-direction: column;
      }

      .score {
        flex: 1;
      }

      .arena {
        min-height: 150px;
      }

      .choice-button {
        min-height: 112px;
        padding: .6rem;
      }

      .choice-icon {
        font-size: 2rem;
      }

      .footer-row {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .choice-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">Quick match / best score</p>
        <h1>Rock, paper,<br>scissors.</h1>
        <p class="intro">Pick your move. The computer is ready, but it has no idea what you are about to throw.</p>
      </div>
      <div class="header-tools">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">☀ Vibrant mode</button>
      </div>
    </header>

    <section class="game-card" aria-labelledby="game-status">
      <div class="scoreboard-panel">
        <p class="scoreboard-heading">Match score</p>
        <div class="scoreboard" aria-label="Game score">
          <div class="score"><span class="score-icon" aria-hidden="true">⚡</span><strong
              id="player-score">0</strong><span>You</span></div>
          <div class="score"><span class="score-icon" aria-hidden="true">◈</span><strong
              id="computer-score">0</strong><span>CPU</span></div>
        </div>
      </div>
      <div class="arena" aria-live="polite">
        <div class="fighter">
          <div class="fighter-label">Your move</div>
          <div class="choice-display" id="player-choice" aria-hidden="true">❔</div>
        </div>
        <div class="versus">vs.</div>
        <div class="fighter">
          <div class="fighter-label">Computer</div>
          <div class="choice-display" id="computer-choice" aria-hidden="true">❔</div>
        </div>
      </div>
      <div class="countdown" id="countdown" aria-live="assertive" aria-atomic="true" hidden></div>
      <p class="message" id="game-status">Choose your move to start the round.</p>
      <p class="prompt">What will you throw?</p>
      <div class="choices" role="group" aria-label="Choose rock, paper, or scissors">
        <button class="choice-button" type="button" data-choice="rock"><span class="choice-icon"
            aria-hidden="true">✊</span><span class="choice-name">Rock</span></button>
        <button class="choice-button" type="button" data-choice="paper"><span class="choice-icon"
            aria-hidden="true">✋</span><span class="choice-name">Paper</span></button>
        <button class="choice-button" type="button" data-choice="scissors"><span class="choice-icon"
            aria-hidden="true">✌️</span><span class="choice-name">Scissors</span></button>
      </div>
      <div class="footer-row">
        <p class="rounds">Rounds played: <strong id="round-count">0</strong></p>
        <button class="reset-button" id="reset-button" type="button">Reset score</button>
      </div>
    </section>
  </main>

  <script>
    const moves = {
      rock: { icon: "✊", label: "Rock" },
      paper: { icon: "✋", label: "Paper" },
      scissors: { icon: "✌️", label: "Scissors" }
    };
    const choices = Object.keys(moves);
    let playerScore = 0;
    let computerScore = 0;
    let roundCount = 0;
    let countdownTimer;
    let roundInProgress = false;

    const playerChoice = document.querySelector("#player-choice");
    const computerChoice = document.querySelector("#computer-choice");
    const status = document.querySelector("#game-status");
    const countdown = document.querySelector("#countdown");
    const playerScoreElement = document.querySelector("#player-score");
    const computerScoreElement = document.querySelector("#computer-score");
    const roundCountElement = document.querySelector("#round-count");
    const choiceButtons = document.querySelectorAll("[data-choice]");
    const resetButton = document.querySelector("#reset-button");
    const themeToggle = document.querySelector("#theme-toggle");
    const themeColor = document.querySelector('meta[name="theme-color"]');

    themeToggle.addEventListener("click", () => {
      const isVibrant = document.body.dataset.theme === "vibrant";
      document.body.dataset.theme = isVibrant ? "dark" : "vibrant";
      themeToggle.setAttribute("aria-pressed", String(!isVibrant));
      themeToggle.textContent = isVibrant ? "☀ Vibrant mode" : "☾ Dark mode";
      themeColor.setAttribute("content", isVibrant ? "#08111f" : "#fff4dc");
    });

    function getResult(playerMove, computerMove) {
      if (playerMove === computerMove) return "tie";
      if ((playerMove === "rock" && computerMove === "scissors") ||
        (playerMove === "paper" && computerMove === "rock") ||
        (playerMove === "scissors" && computerMove === "paper")) return "win";
      return "loss";
    }

    function finishRound(playerMove, computerMove) {
      const result = getResult(playerMove, computerMove);
      roundCount += 1;
      if (result === "win") playerScore += 1;
      if (result === "loss") computerScore += 1;
      playerChoice.textContent = moves[playerMove].icon;
      computerChoice.textContent = moves[computerMove].icon;
      playerScoreElement.textContent = playerScore;
      computerScoreElement.textContent = computerScore;
      roundCountElement.textContent = roundCount;
      status.textContent = result === "tie"
        ? `A tie. You both chose ${moves[playerMove].label.toLowerCase()}.`
        : result === "win"
          ? `${moves[playerMove].label} beats ${moves[computerMove].label.toLowerCase()}. You win!`
          : `${moves[computerMove].label} beats ${moves[playerMove].label.toLowerCase()}. Computer wins.`;
      countdown.hidden = true;
      roundInProgress = false;
      choiceButtons.forEach((button) => button.disabled = false);
      resetButton.disabled = false;
    }

    function playRound(playerMove) {
      if (roundInProgress) return;
      const computerMove = choices[Math.floor(Math.random() * choices.length)];
      let countdownValue = 3;
      roundInProgress = true;
      choiceButtons.forEach((button) => button.disabled = true);
      resetButton.disabled = true;
      playerChoice.textContent = moves[playerMove].icon;
      computerChoice.textContent = "❔";
      status.textContent = "The computer is choosing...";
      countdown.hidden = false;
      countdown.textContent = countdownValue;
      countdownTimer = setInterval(() => {
        countdownValue -= 1;
        if (countdownValue > 0) {
          countdown.textContent = countdownValue;
          return;
        }
        clearInterval(countdownTimer);
        countdown.textContent = "GO!";
        finishRound(playerMove, computerMove);
      }, 700);
    }

    choiceButtons.forEach((button) => {
      button.addEventListener("click", () => playRound(button.dataset.choice));
    });

    resetButton.addEventListener("click", () => {
      clearInterval(countdownTimer);
      playerScore = 0;
      computerScore = 0;
      roundCount = 0;
      roundInProgress = false;
      playerChoice.textContent = "❔";
      computerChoice.textContent = "❔";
      playerScoreElement.textContent = "0";
      computerScoreElement.textContent = "0";
      roundCountElement.textContent = "0";
      status.textContent = "Choose your move to start the round.";
      countdown.textContent = "";
      countdown.hidden = true;
      choiceButtons.forEach((button) => button.disabled = false);
    });
  </script>
</body>

</html>
